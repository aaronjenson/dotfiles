[dotfiles]
"~/.bashrc.d" = { mode = "track" }
"~/.bashrc/userconfigdir" = { block = '''
# User specific aliases and functions
if [ -d ~/.bashrc.d ]; then
    for rc in ~/.bashrc.d/*; do
        if [ -f "$rc" ]; then
            . "$rc"
        fi
    done
fi
unset rc
''' }
"~/.config/mise/conf.d/ubuntu-home-files" = { mode = "track", variants = [{ profile = "ubuntu-home" }] }
"~/.config/mise/conf.d/ubuntu-home.toml" = { mode = "track", variants = [{ profile = "ubuntu-home" }] }
"~/.config/mise/config.games.toml" = { mode = "track" }
"~/.config/mise/config.personal.toml" = { mode = "track" }
"~/.config/mise/config.surface.toml" = { mode = "track" }
"~/.config/mise/config.work.toml" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/mise/scripts" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.packages]
"dnf:neovim" = "latest"
"apt:ghostty" = "latest"
"apt:ripgrep" = "latest"

[tools]
gh = "latest"
lazygit = "latest"
neovim = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node"]

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

